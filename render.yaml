# Render Blueprint Specification for Family Bridge Backend
# Official Docs: https://render.com/docs/blueprint-spec
#
# Arch Decision: Uses Docker runtime (context: repo root) to provide MySQL C development
# headers (default-libmysqlclient-dev, pkg-config) required to compile mysqlclient==2.2.8
# on Linux, while preserving monorepo access to both backend/ and packages/.
#
# Migration strategy (Free plan):
#   preDeployCommand is NOT available on Render Free plan (paid web services only).
#   Source: https://render.com/docs/deploys#pre-deploy-command
#   Run migrations from your local machine against the remote MySQL DB before the first
#   deploy and before each schema-changing deploy.
#   See docs/handover/blueprint-deployment-guide.md for the complete procedure.
#
# healthCheckPath probes the liveness endpoint (/api/v1/health/), which never touches DB.
services:
  - type: web
    name: family-bridge-backend
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: 'off'
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DB_ENGINE
        value: mysql
      # Real environment/secret variables supplied by Huy on Render Dashboard (sync: false).
      # Never commit real credentials to Git (SEC-19).
      #
      # DJANGO_ALLOWED_HOSTS: comma-separated list of custom domain hostnames only.
      # The service's onrender.com hostname is automatically added at runtime via
      # RENDER_EXTERNAL_HOSTNAME (injected by Render, read in backend/config/settings.py).
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      # CORS_ALLOWED_ORIGINS: comma-separated frontend origins permitted to call the API.
      # Set to your actual local dev origins for testing (e.g. http://localhost:3000).
      # Zalo Mini App WebView origins must be verified during device integration before adding.
      # Do NOT use wildcards.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      # Path to CA certificate for TLS verification.
      # Defaults to /etc/ssl/certs/ca-certificates.crt inside the container image.
      - key: MYSQL_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      # Zalo verification credentials (SEC-01). Fails closed when missing.
      - key: ZALO_APP_ID
        sync: false
      - key: ZALO_APP_SECRET
        sync: false
      # FB_FEATURES is intentionally NOT declared here.
      # When the variable is absent, settings.py defaults to loading all 16 feature app labels.
      # Declaring it as sync:false risks an accidental empty string being entered,
      # which causes settings.py to load 0 features (FB_FEATURES="" -> csv split -> []).
      # To narrow the feature set for ops/rollback, set FB_FEATURES manually in the
      # Render Dashboard Environment tab using explicit labels separated by commas:
      #   e.g. f01_identity,f02_program,f15_privacy,admin_core

  # ---------------------------------------------------------------------------
  # Web (Task 2 — Render static service): single codebase zalo-mini-app built
  # to zalo-mini-app/www and served as a Render static site.
  #
  # ADR summary:
  # - Single codebase: the SAME zalo-mini-app Vite app ships both the Zalo Mini
  #   App bundle and this static web build (no second frontend to maintain).
  # - Hash router (#/route) → NO SPA fallback/rewrite rule is needed; deep links
  #   always hit /index.html which bootstraps the router client-side.
  # - runtime: static (NOT docker) — no server process, free plan compatible.
  # - Token/session stays IN MEMORY (SEC-10): nothing is persisted server-side
  #   for the web origin; the backend serves sessions for both hosts.
  # - NO Tailwind CDN (and no other CDN assets): all styles/fonts are bundled
  #   locally — enforced by tests/qa-web-invariants.test.mjs.
  #
  # Owner checklist (see docs/handover/web-render/web-render-deployment.md):
  # 1. Apply this service in the Render Dashboard ("Apply" from Blueprint).
  # 2. Set VITE_API_BASE_URL=https://family-bridge-backend.onrender.com
  #    (sync:false — never commit it; it is baked into the JS bundle at build).
  # 3. Backend env CORS_ALLOWED_ORIGINS += https://family-bridge-web.onrender.com
  #    (comma-separated list, no wildcards).
  # 4. First deploy is MANUAL ("Manual Deploy" button) — autoDeployTrigger stays
  #    'off' until the first successful verification from the live site; flip it
  #    afterwards if you want push-to-deploy.
  # 5. Verify: open the site, login with a class code, check /api/v1/health/.
  #
  # NOTE: buildCommand deliberately EXCLUDES `npm test` — tests run in CI
  # (ops/ci/tests.yml, miniapp job) and should never block/gate a static deploy
  # twice. render.yaml env vars only affect the BUILD environment (VITE_* is
  # compile-time); runtime needs no server env.
  # ---------------------------------------------------------------------------
  - type: web
    name: family-bridge-web
    runtime: static
    region: singapore
    branch: main
    buildCommand: cd zalo-mini-app && npm ci && npm run build
    staticPublishPath: zalo-mini-app/www
    autoDeployTrigger: 'off'
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      # Baked into the frontend bundle at build time (Vite). Owner sets the real
      # value in the Render Dashboard (sync: false) — must be the backend origin
      # with HTTPS, no trailing slash.
      - key: VITE_API_BASE_URL
        sync: false
      # Optional build label shown on the login screen during test rounds.
      - key: VITE_TEST_LABEL
        sync: false
    headers:
      # Hashed Vite assets are immutable — cache forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html is the hash-router bootstrap — always revalidate.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # Baseline hardening for every response.
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
