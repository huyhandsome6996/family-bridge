# Render Blueprint Specification for Family Bridge Backend
# Official Docs: https://render.com/docs/blueprint-spec
#
# Arch Decision: Uses Docker runtime (context: repo root) to provide MySQL C development
# headers (default-libmysqlclient-dev, pkg-config) required to compile mysqlclient==2.2.8
# on Linux, while preserving monorepo access to both backend/ and packages/.
#
# Migrations are executed once per deploy via preDeployCommand, keeping startup clean.
# healthCheckPath probes the liveness endpoint (/api/v1/health/), which never touches DB.
services:
  - type: web
    name: family-bridge-backend
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: 'off'
    preDeployCommand: python backend/manage.py migrate --noinput
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DB_ENGINE
        value: mysql
      # Real environment/secret variables supplied by Huy on Render Dashboard (sync: false).
      # Never commit real credentials to Git (SEC-19).
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      # Path to CA certificate Secret File (e.g. /etc/secrets/ca.pem) if TLS is required by DB provider.
      - key: MYSQL_SSL_CA
        sync: false
      # Zalo verification credentials (SEC-01). Fails closed when missing.
      - key: ZALO_APP_ID
        sync: false
      - key: ZALO_APP_SECRET
        sync: false
      # Feature set selection allowlist (optional, defaults to all 15 features mounted).
      - key: FB_FEATURES
        sync: false
