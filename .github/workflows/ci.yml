name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  agent-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_agent_docs.py
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: test
      DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test core
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: family_bridge
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DJANGO_ENV: test
      DB_ENGINE: mysql
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: family_bridge
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config
      - run: pip install -r backend/requirements-mysql.txt
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py test core
  mini-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zalo-mini-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zalo-mini-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
